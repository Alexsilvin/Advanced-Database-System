[build]
  command = "vite build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  APP_URL = "http://localhost:3001"
  ADMIN_BOOTSTRAP_USERNAME = "admin"
  S3_REGION = "us-east-1"
  S3_ENDPOINT = "https://s3.filebase.com"
  S3_BUCKET = "sfc-rom"
  FILEBASE_BUCKET = "sfc-rom"
  S3_FORCE_PATH_STYLE = "true"
  FILEBASE_IPFS_RPC_ENDPOINT = "https://rpc.filebase.io"

[[redirects]]
  from = "/api/auth/signup"
  to = "/.netlify/functions/auth-signup"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
